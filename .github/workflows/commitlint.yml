name: Commit Lint

on:
  workflow_run:
    workflows: 
      - "Enforce Branch Flow"
    types:
      - completed
permissions:
  contents: read      # สำหรับ checkout
  pull-requests: write  # สำหรับ comment PR

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    # if: |
    #   github.event.workflow_run.conclusion == 'success' &&
    #   github.event.workflow_run.event == 'pull_request' &&
    #   github.event.workflow_run.pull_requests &&
    #   (
    #     github.event.workflow_run.pull_requests.base.ref == 'develop' ||
    #     ( 
    #       startsWith(github.event.workflow_run.head_branch, 'hotfix/') &&
    #       github.event.workflow_run.pull_requests.base.ref == 'staging'
    #     )
    #   )

    steps:
      - name: Debug payload
        run: |
          echo '${{ toJson(github.event.workflow_run) }}'

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Validate commits
        id: lint
        run: |
          # ติดตั้ง commitlint
          npm install -g @commitlint/cli @commitlint/config-conventional

          # ตรวจทุก commit ใน PR เทียบกับ base branch
          # ใช้ --from/--to แทนการสร้าง commits.txt
          npx commitlint --from origin/${{ github.base_ref }} --to HEAD --config commitlint.config.js --no-color | tee result.txt || true

          # ถ้า result.txt มี ✖ แปลว่ามี commit fail
          if grep -q "✖" result.txt; then
            echo "fail=1" >> $GITHUB_OUTPUT
          else
            echo "fail=0" >> $GITHUB_OUTPUT
          fi

      - name: Manage PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- commitlint-comment -->";
            const status = "${{ steps.lint.outputs.fail }}" === "1";
            const fs = require('fs');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const botComment = comments.data.find(c =>
              c.body.includes(marker)
            );

            if (status) {
              const result = fs.readFileSync('result.txt', 'utf8');

              const body = `${marker}
            ❌ **Commit message ไม่ผ่าน format**

            📌 ผลการตรวจ:
            \`\`\`
            ${result}
            \`\`\`

            👉 วิธีแก้:
            - git commit --amend สำหรับ commit message ล่าสุด
            - หรือ git rebase -i origin/${context.payload.pull_request.base.ref}
            - หรือ git rebase -i HEAD~N (N หมายถึงจำนวนที่ต้องการแก้นับจากใหม่ไปเก่า)
            - แล้ว git push --force-with-lease 
            `;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body
                });
              }

            } else {
              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: botComment.id
                });
              }
            }

      - name: Fail job if commit invalid
        if: steps.lint.outputs.fail == '1'
        run: exit 1
