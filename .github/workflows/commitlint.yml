name: Commit Lint

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commits
        run: |
          # ดึง base branch เพื่อใช้ compare
          git fetch origin ${{ github.base_ref }} --depth=1

          # เก็บ commit ใน PR (hash + message)
          git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%h|%s" > commits.txt

      - name: Validate commits (per commit)
        id: lint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

          FAIL=0
          > result.txt

          # อ่าน commit.txt ทีละบรรทัดเช็ค commit message แล้วบันทึกผลลัพธ์ลงใน result.txt
          while IFS="|" read -r hash msg
          do
            echo "$msg" | npx commitlint --config commitlint.config.js > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "❌ $hash $msg" >> result.txt
              FAIL=1
            else
              echo "✅ $hash $msg" >> result.txt
            fi
          done < commits.txt

          # export output ไปในตัวแปร fail
          echo "fail=$FAIL" >> $GITHUB_OUTPUT

      - name: Manage PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- commitlint-comment -->";
            const status = "${{ steps.lint.outputs.fail }}" === "1";
            const fs = require('fs');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const botComment = comments.data.find(c =>
              c.body.includes(marker)
            );

            if (status) {
              const result = fs.readFileSync('result.txt', 'utf8');

              const body = `${marker}
            ❌ **Commit message ไม่ผ่าน format**

            📌 ผลการตรวจ:
            \`\`\`
            ${result}
            \`\`\`

            👉 วิธีแก้:
            - git commit --amend
            - หรือ git rebase -i origin/${context.payload.pull_request.base.ref}
            - แล้ว push --force
            `;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body
                });
              }

            } else {
              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: botComment.id
                });
              }
            }

      - name: Fail job if commit invalid
        if: steps.lint.outputs.fail == '1'
        run: exit 1
