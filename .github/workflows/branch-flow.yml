name: Enforce Branch Flow

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch all branches
        run: git fetch --all

      - name: Validate PR flow
        id: validate
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          ERROR=""

          # ❌ main รับได้แค่จาก staging
          if [[ "$BASE" == "main" && "$HEAD" != "staging" ]]; then
            ERROR="❌ You must merge into main only from staging"
          fi

          # ❌ staging รับได้แค่จาก develop
          if [[ "$BASE" == "staging" && "$HEAD" != "develop" ]]; then
            ERROR="❌ You must merge into staging only from develop"
          fi

          # ❌ develop ต้องมาจาก branch ที่แตกจาก develop เท่านั้น
          if [[ "$BASE" == "develop" ]]; then
            git merge-base --is-ancestor origin/develop origin/$HEAD || {
              ERROR="❌ Branch must be created from develop"
            }
          fi

          if [[ -n "$ERROR" ]]; then
            echo "error_message=$ERROR" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Branch flow is valid"

        # 💬 Comment บอกเหตุผล
      - name: Comment on PR
        if: failure() && github.event.pull_request.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const alreadyCommented = comments.some(c =>
              c.body.includes("Branch flow violation")
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🚫 Branch flow violation

            ${{ steps.validate.outputs.error_message }}

            👉 Please create a new PR with correct target branch.`
              });
            }

      # 🔒 ปิด PR อัตโนมัติ
      - name: Close PR
        if: failure() && github.event.pull_request.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed"
            });
