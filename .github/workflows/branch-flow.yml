name: Enforce Branch Flow

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch all branches
        run: git fetch --all

      - name: Validate PR flow
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          # ❌ main รับได้แค่จาก staging
          if [[ "$BASE" == "main" && "$HEAD" != "staging" ]]; then
            echo "❌ You must merge into main only from staging"
            exit 1
          fi

          # ❌ staging รับได้แค่จาก develop
          if [[ "$BASE" == "staging" && "$HEAD" != "develop" ]]; then
            echo "❌ You must merge into staging only from develop"
            exit 1
          fi

          # ❌ develop ต้องมาจาก branch ที่แตกจาก develop เท่านั้น
          if [[ "$BASE" == "develop" ]]; then
            git merge-base --is-ancestor origin/develop origin/$HEAD || {
              echo "❌ Branch must be created from develop"
              exit 1
            }
          fi

          echo "✅ Branch flow is valid"