name: Enforce Branch Flow

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write  # สำหรับ comment PR

jobs:
  validate-branch-flow:
    name: Validate branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch all branches
        run: git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Validate PR flow
        id: validate
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          CLOSE="false"
          ERROR=""

          # ❌ main รับได้แค่จาก staging
          if [[ "$BASE" == "main" && "$HEAD" != "staging" ]]; then
            ERROR="❌ You must merge into main only from staging"
            CLOSE="true"
          fi

          # ❌ staging รับได้จาก develop และ hotfix/*
          if [[ "$BASE" == "staging" ]]; then
            # 👉 develop → staging (ผ่านได้เลย)
            if [[ "$HEAD" == "develop" ]]; then
              echo "✅ develop -> staging OK"

            # 👉 hotfix → staging (ต้อง strict)
            elif [[ "$HEAD" =~ ^hotfix/ ]]; then
              echo "🔍 validate hotfix is up-to-date with staging"

              git fetch origin staging

              # เช็คว่า staging เป็น ancestor ของ hotfix หรือไม่
              git merge-base --is-ancestor origin/staging origin/$HEAD || {
                ERROR="❌ hotfix must be up-to-date with staging"
                CLOSE="true"
              }

            # 👉 อื่น ๆ = ไม่ให้เข้า
            else
              ERROR="❌ You must merge into staging only from develop or hotfix/*"
              CLOSE="true"
            fi
          fi

          # ❌ develop
          if [[ "$BASE" == "develop" ]]; then

            if [[ "$HEAD" =~ ^auto/sync ]]; then
              echo "ℹ️ Allow staging → develop (sync case)"

            else
              echo "🔍 validate branch from develop"

              git fetch origin develop

              # ตรวจว่า branch แตกจาก develop จริง
              git merge-base --is-ancestor origin/develop origin/$HEAD || {
                ERROR="❌ Branch must be created from develop and up-to-date"
                CLOSE="true"
              }
            fi
          fi

          if [[ -n "$ERROR" ]]; then
            echo "error_message=$ERROR" >> $GITHUB_OUTPUT
            echo "should_close=$CLOSE" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Branch flow is valid"

        # 💬 Delete comment บอกเหตุผลถ้าสำเร็จ
      - name: Delete comment on PR
        if: success() && github.event.pull_request.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- branch-flow-comment -->";
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
            });

            const alreadyCommented = comments.find(c =>
              c.body.includes(marker)
            );

            if(alreadyCommented){
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: alreadyCommented.id
              });
            }

        # 💬 Comment บอกเหตุผล
      - name: Comment on PR
        if: failure() && github.event.pull_request.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- branch-flow-comment -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const alreadyCommented = comments.some(c =>
              c.body.includes(marker)
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `${marker}
            🚫 Branch flow violation

            ${{ steps.validate.outputs.error_message }}

            👉 Please create a new PR with correct target branch.`
              });
            }

      # 🔒 ปิด PR อัตโนมัติ
      - name: Close PR
        if: failure() && github.event.pull_request.state == 'open' && steps.validate.outputs.should_close == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed"
            });
