name: Hotfix Propagation

on:
  pull_request:
    types: [closed]
    branches:
      - staging   # trigger หลัง hotfix merge เข้า staging

jobs:
  propagate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'hotfix/')

    steps:
      - name: Checkout staging (clean)
        run: |
          git fetch origin
          git checkout -B staging origin/staging

      - name: Debug branch
        run: |
          echo "Current branch:"
          git branch
          git log --oneline -5

      - name: Debug Info
        run: |
          echo "PR #${{ github.event.pull_request.number }} merged into staging"
          echo "Head Ref: ${{ github.head_ref }}"
          echo "Base Ref: ${{ github.base_ref }}"
          git log --oneline origin/develop..origin/staging

      # 🔹 PR: staging → develop
      - name: Create PR to develop
        id: pr_develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/sync-staging-to-develop-${{ github.run_id }}
        #   delete-branch: true
          base: develop
          title: "Sync staging → develop"
          body: "Auto PR to propagate hotfix from staging to develop"
          commit-message: "chore: sync staging to develop"

      # 🔹 Enable auto merge (develop)
      - name: Enable auto-merge (develop)
        if: steps.pr_develop.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.pr_develop.outputs.pull-request-number }}
          merge-method: merge