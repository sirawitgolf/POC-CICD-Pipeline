name: Auto Sync

on:
  push:
    branches:
      - main
      - staging

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Sync
        run: |
          git fetch origin

          BRANCH="${GITHUB_REF#refs/heads/}"

          if [ "$BRANCH" = "main" ]; then
            echo "🔁 main → staging"
            git checkout staging

            if ! git merge origin/main --no-edit 2>&1; then
                echo "❌ Merge from main to staging failed"
                exit 1
            fi 

            git push origin staging

          elif [ "$BRANCH" = "staging" ]; then
            echo "🔁 staging → develop"
            git checkout develop

            if ! git merge origin/staging --no-edit 2>&1; then
                echo "❌ Merge from staging to develop failed"
                exit 1
            fi          

            git push origin develop
          fi